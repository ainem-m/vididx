[workspace]
members = [
    "crates/vididx-core",
    "crates/vididx-media",
    "crates/vididx-asr",
    "crates/vididx-vision",
    "crates/vididx-segment",
    "crates/vididx-llm",
    "crates/vididx-output",
    "crates/vididx-pipeline",
    "crates/vididx-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
anyhow      = "1"
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing     = "0.1"
clap        = { version = "4", features = ["derive"] }
chrono      = { version = "0.4", features = ["serde"] }
