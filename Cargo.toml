[workspace]
members = [
    "crates/vidx-core",
    "crates/vidx-media",
    "crates/vidx-asr",
    "crates/vidx-vision",
    "crates/vidx-segment",
    "crates/vidx-llm",
    "crates/vidx-output",
    "crates/vidx-pipeline",
    "crates/vidx-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
anyhow      = "1"
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing     = "0.1"
clap        = { version = "4", features = ["derive"] }
