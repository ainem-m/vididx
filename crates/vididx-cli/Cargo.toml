[package]
name = "vididx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vididx"
path = "src/main.rs"

[dependencies]
vididx-core = { path = "../vididx-core" }
vididx-pipeline = { path = "../vididx-pipeline" }
vididx-output = { path = "../vididx-output" }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
